<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#42526b"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4b3c"/></marker></defs>
<rect width="940" height="420" fill="#ffffff"/>
<text x="30" y="36" font-size="18" font-weight="600" text-anchor="start" fill="#20303f">Two adaptation modules on one feature layer</text>
<text x="30" y="58" font-size="12" font-weight="400" text-anchor="start" fill="#5a6b80">the adversarial discriminator closes the global gap; CORAL matches second-order statistics</text>
<rect x="40" y="100" width="400" height="130" rx="12" fill="#f4f6f8" stroke="#00000018"/>
<text x="60" y="126" font-size="13" font-weight="600" text-anchor="start" fill="#20303f">Adversarial domain discriminator</text>
<text x="60" y="150" font-size="11" font-weight="400" text-anchor="start" fill="#5a6b80">D tries to tell source from target;</text>
<text x="60" y="168" font-size="11" font-weight="400" text-anchor="start" fill="#5a6b80">the reversed gradient makes F fool it.</text>
<rect x="70" y="182" width="100" height="36" rx="8" fill="#ef8354" stroke="#00000018"/>
<text x="120.0" y="203.66666666666666" fill="#ffffff" font-size="11" text-anchor="middle">F(x)</text>
<path d="M170,200 L196,200" stroke="#42526b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="196" y="182" width="74" height="36" rx="8" fill="#ef4b3c" stroke="#00000018"/>
<text x="233.0" y="203.66666666666666" fill="#ffffff" font-size="11" text-anchor="middle">GRL</text>
<path d="M270,200 L296,200" stroke="#42526b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="296" y="182" width="110" height="36" rx="8" fill="#ef4b3c" stroke="#00000018"/>
<text x="351.0" y="203.66666666666666" fill="#ffffff" font-size="11" text-anchor="middle">D  source?</text>
<path d="M296,176 L100,176" stroke="#ef4b3c" stroke-width="1.6" fill="none" marker-end="url(#rev)"/>
<text x="150" y="168" font-size="11" font-weight="700" text-anchor="start" fill="#ef4b3c">&#8722;&#8711;</text>
<rect x="490" y="100" width="410" height="130" rx="12" fill="#f4f6f8" stroke="#00000018"/>
<text x="510" y="126" font-size="13" font-weight="600" text-anchor="start" fill="#20303f">CORAL</text>
<text x="510" y="150" font-size="11" font-weight="400" text-anchor="start" fill="#5a6b80">MMD-style criteria align first-order statistics;</text>
<text x="510" y="168" font-size="11" font-weight="400" text-anchor="start" fill="#5a6b80">matching covariances captures the relationships</text>
<text x="510" y="186" font-size="11" font-weight="400" text-anchor="start" fill="#5a6b80">between features that a mean match leaves alone.</text>
<rect x="520" y="196" width="120" height="26" rx="8" fill="#7e57c2" stroke="#00000018"/>
<text x="580.0" y="212.33333333333334" fill="#ffffff" font-size="10" text-anchor="middle">C&#8347;  source</text>
<text x="652" y="214" font-size="15" font-weight="700" text-anchor="middle" fill="#7e57c2">&#8596;</text>
<rect x="668" y="196" width="120" height="26" rx="8" fill="#7e57c2" stroke="#00000018"/>
<text x="728.0" y="212.33333333333334" fill="#ffffff" font-size="10" text-anchor="middle">C&#8348;  target</text>
<text x="30" y="278" font-size="13" font-weight="600" text-anchor="start" fill="#20303f">What each one does to the feature distribution</text>
<ellipse cx="110.0" cy="340" rx="62" ry="34" fill="#2b6cb0" opacity="0.35"/>
<ellipse cx="170.0" cy="340" rx="62" ry="34" fill="#ef8354" opacity="0.45"/>
<text x="140" y="400" font-size="12" font-weight="600" text-anchor="middle" fill="#42526b">no adaptation</text>
<ellipse cx="389.0" cy="340" rx="62" ry="34" fill="#2b6cb0" opacity="0.35"/>
<ellipse cx="411.0" cy="340" rx="62" ry="34" fill="#ef8354" opacity="0.45"/>
<text x="400" y="400" font-size="12" font-weight="600" text-anchor="middle" fill="#42526b">adversarial only</text>
<ellipse cx="656.0" cy="340" rx="62" ry="34" fill="#2b6cb0" opacity="0.35"/>
<ellipse cx="664.0" cy="340" rx="62" ry="34" fill="#ef8354" opacity="0.45"/>
<text x="660" y="400" font-size="12" font-weight="600" text-anchor="middle" fill="#42526b">adversarial + CORAL</text>
<text x="770" y="336" font-size="11" font-weight="600" text-anchor="start" fill="#2b6cb0">source</text>
<text x="770" y="354" font-size="11" font-weight="600" text-anchor="start" fill="#ef8354">target</text>
</svg>
